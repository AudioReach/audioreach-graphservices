name: trigger_lava_on_success

on:
  workflow_run:
    workflows: ["pre_merge_build"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  create_pending_check:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      check_run_id: ${{ steps.create.outputs.check_run_id }}
    steps:
      - name: Create pending LAVA check run on PR commit
        id: create
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'LAVA Hardware Tests',
              head_sha: context.payload.workflow_run.head_sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              output: {
                title: 'LAVA Tests Running',
                summary: 'Hardware tests are running on LAVA infrastructure. Merge is blocked until tests complete.'
              }
            });
            core.setOutput('check_run_id', String(data.id));

  prepare_matrix:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      build_urls: ${{ steps.read_url.outputs.build_urls }}

    steps:
      - name: Download test matrix artifact
        uses: actions/download-artifact@v4
        with:
          name: test-matrix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download presigned URL artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: presigned_url_*.txt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: presigned_urls
          merge-multiple: true

      - name: Read presigned URLs
        id: read_url
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const baseDir = 'presigned_urls'
            const entries = fs.readdirSync(baseDir)

            console.log('Entries:', entries)

            if (entries.length === 0) {
              throw new Error('No presigned URL files found')
            }

            const urls = {}

            for (const entry of entries) {
              const fullPath = path.join(baseDir, entry)
              if (fs.statSync(fullPath).isFile()) {
                const content = fs.readFileSync(fullPath, 'utf8').trim()
                urls[entry] = content
                console.log(`Loaded ${entry}: ${content}`)
              }
            }

            if (Object.keys(urls).length === 0) {
              throw new Error('No valid presigned URL files found')
            }

            core.setOutput('build_urls', JSON.stringify(urls))

      - name: Re-upload presigned URL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: presigned_urls
          path: presigned_urls

      - name: Read matrix JSON
        id: matrix
        shell: bash
        run: |
          test -f test_matrix.json
          MATRIX=$(cat test_matrix.json)
          echo "test_matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  trigger_lava:
    needs: prepare_matrix
    uses: Audioreach/audioreach-workflows/.github/workflows/test.yml@master
    secrets: inherit
    with:
      build_matrix: ${{ needs.prepare_matrix.outputs.test_matrix }}
      build_urls: ${{ needs.prepare_matrix.outputs.build_urls }}

  report_final_status:
    needs: [create_pending_check, trigger_lava]
    if: always() && needs.create_pending_check.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Update LAVA check run with final result
        uses: actions/github-script@v8
        with:
          script: |
            const lavaResult = '${{ needs.trigger_lava.result }}';
            const isSuccess = lavaResult === 'success';

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number('${{ needs.create_pending_check.outputs.check_run_id }}'),
              status: 'completed',
              conclusion: isSuccess ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: isSuccess ? 'LAVA Tests Passed' : 'LAVA Tests Failed',
                summary: `Hardware tests ${isSuccess ? 'completed successfully' : `failed (status: ${lavaResult})`}.`,
                text: `Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
              }
            });
